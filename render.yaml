services:
  - type: web
    name: pelimatch
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Estos dos los pones tú en el panel de Render (no van en el repo):
      - key: MONGODB_URI
        sync: false
      - key: TMDB_TOKEN
        sync: false
